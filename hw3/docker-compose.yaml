services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user_service:
    build: ./user_service
    container_name: user-service
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres"
      SECRET_KEY: "supersecretkey"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  user_service_tests:
    build: ./user_service
    container_name: user-service-tests
    command: ["pytest", "tests/"]
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres"
      USER_SERVICE_URL: "http://user-service:8001"
    depends_on:
      db:
        condition: service_healthy
      user_service:
        condition: service_started

  post_service:
    build: ./post_service
    container_name: post-service
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/postgres"
    ports:
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy

  api_service:
    build:
      context: .
      dockerfile: ./api_service/Dockerfile
    container_name: api-service
    ports:
      - "8000:8000"
    depends_on:
      user_service:
        condition: service_started
      post_service:
        condition: service_started